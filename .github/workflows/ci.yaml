name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      # Backs the store with the Actions cache, so the toolchain and crane's
      # deps-only derivation survive between runs.
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - run: nix flake check -L
      - run: nix build -L
