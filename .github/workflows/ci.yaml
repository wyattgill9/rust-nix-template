name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # One runner per system the flake claims to support.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]

    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Evaluate
        run: nix flake check -L

      - name: Build
        run: nix build -L

      # rustc silently falls back to its bundled lld if the wild flags stop
      # taking effect, and the build still passes. wild is ELF-only.
      - name: Verify wild linked the binary
        if: runner.os == 'Linux'
        run: |
          readelf -p .comment result/bin/cli | grep 'Linker: Wild'
