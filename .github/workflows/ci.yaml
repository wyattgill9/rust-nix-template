        #     nix run github:manic-systems/evix -- eval \
        #       --flake ".#$root" --force-recurse \
        #       --workers "$(nproc)" \
        #       > "jobs-$root.ndjson"
        #   done
        #   if jq -e 'select(has("error"))' jobs-*.ndjson; then
        #     echo "::error::flake evaluation failed" && exit 1
