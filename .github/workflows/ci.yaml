      #       | tar xz -C /usr/local --strip-components=1

      - name: Evaluate
        run: nix flake check -L
        # Alternative: fix flake check --extra-experimental-features flakes
        # Alternative: evix, emits jobs-*.ndjson consumed by the Build step below
